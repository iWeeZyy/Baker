services:
  - type: web
    name: bakers-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: bakers
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      # Sightengine API user/secret for message-photo moderation
      # (https://sightengine.com/). Left unset, photos still send but always
      # fall back to MODERATION_FALLBACK (see backend/.env.example).
      - key: SIGHTENGINE_API_USER
        sync: false
      - key: SIGHTENGINE_API_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      # Emails granted Baker Pro (no billing provider yet); set in the dashboard.
      - key: PRO_EMAILS
        sync: false
      # Ads stay off until Baker Pro is purchasable and a consent flow exists.
      - key: ADS_ENABLED
        value: "false"

  - type: web
    name: bakers-frontend
    runtime: static
    rootDir: frontend
    buildCommand: yarn install && npx expo export --platform web --output-dir dist
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_BACKEND_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
