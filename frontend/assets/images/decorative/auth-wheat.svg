<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!--
    Motif de fond discret pour l'écran de connexion (frontend/app/auth.tsx) :
    un épi de blé + une ligne courbe, dans le même esprit que les vignettes de
    famille/produit déjà dessinées (frontend/assets/images/{families,products}
    /*.svg) — uniquement des couleurs de src/theme.ts, jamais de couleur codée
    en dur hors thème. Contrairement à ces vignettes, ce fichier n'a PAS de
    <rect> de fond : il doit rester transparent pour se superposer à
    colors.surface sans le masquer. L'opacité faible est portée directement
    par les attributs SVG (stroke-opacity/fill-opacity), pas par un opacity
    React Native côté écran, pour rester cohérent avec la convention déjà
    établie par couronne.svg et consorts.
  -->
  <g stroke="#C05A35" stroke-width="5" stroke-linecap="round" fill="none" stroke-opacity="0.16">
    <path d="M 30 700 Q 220 640 400 700 Q 470 723 520 700" />
  </g>
  <g stroke="#8B4527" stroke-width="7" stroke-linecap="round" fill="none" stroke-opacity="0.16">
    <path d="M 660 730 L 560 250" />
  </g>
  <g fill="#D4A373" fill-opacity="0.2">
    <ellipse cx="626" cy="440" rx="26" ry="46" transform="rotate(-28 626 440)" />
    <ellipse cx="574" cy="440" rx="26" ry="46" transform="rotate(28 574 440)" />
    <ellipse cx="614" cy="370" rx="24" ry="44" transform="rotate(-24 614 370)" />
    <ellipse cx="566" cy="370" rx="24" ry="44" transform="rotate(24 566 370)" />
    <ellipse cx="602" cy="500" rx="24" ry="44" transform="rotate(-24 602 500)" />
    <ellipse cx="558" cy="500" rx="24" ry="44" transform="rotate(24 558 500)" />
    <ellipse cx="590" cy="565" rx="22" ry="40" transform="rotate(-22 590 565)" />
    <ellipse cx="550" cy="565" rx="22" ry="40" transform="rotate(22 550 565)" />
  </g>
  <g fill="#C05A35" fill-opacity="0.16">
    <ellipse cx="620" cy="310" rx="18" ry="34" transform="rotate(-18 620 310)" />
    <ellipse cx="584" cy="310" rx="18" ry="34" transform="rotate(18 584 310)" />
  </g>
</svg>
